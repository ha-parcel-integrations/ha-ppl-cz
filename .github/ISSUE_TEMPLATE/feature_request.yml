name: Feature request
description: Suggest a new feature or enhancement for the PPL CZ integration
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - peter-mdf
body:
  - type: dropdown
    id: source
    attributes:
      label: Which PPL CZ setup is this about?
      description: The source you picked during setup, shown on the integration's entry under Settings → Devices & services → PPL CZ.
      options:
        - Account (automatic import)
        - Tracking codes
        - All of them / not setup-specific
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would you use this? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Is there an existing workaround, or have you tried something else?
